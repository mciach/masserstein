[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masserstein"
version = "2.0.1"
description = "A library for analysis of Mass Spectrometry data using the Wasserstein metric"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gambin Lab", email = "michal.aleksander.ciach@gmail.com" },
]
keywords = ["mass", "spectrometry", "spectral", "deconvolution"]
requires-python = ">=3.10,<4"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "IsoSpecPy",
    "numpy>=2.0.0",
    "scipy",
    "pulp",
    "tqdm",
]

[project.optional-dependencies]
graphics = ["matplotlib"]
# Dependencies of masserstein.polymers, which is not imported by default.
# lxml is an undeclared transitive requirement of pyteomics.
polymers = ["pandas", "matplotlib", "pyteomics", "lxml"]
test = ["pytest", "pandas", "matplotlib", "pyteomics", "lxml"]

[project.urls]
Homepage = "https://github.com/mciach/masserstein"

[tool.setuptools]
packages = ["masserstein"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # pulp emits these from its own internals on recent Pythons.
    "ignore::DeprecationWarning:pulp.*",
]
